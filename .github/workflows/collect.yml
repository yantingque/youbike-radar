name: collect

# 每 10 分鐘收集一次 YouBike 即時快照，存到 data 分支
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 與 compact 共用，同一時間只有一個 job 寫 data 分支
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data 分支
        uses: actions/checkout@v4
        with:
          ref: data
          path: datarepo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 收集快照
        run: python -m ubike.collect --out datarepo

      - name: Commit 並 push 到 data 分支
        working-directory: datarepo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -q -m "data: 快照 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0
            echo "push 失敗，第 $i 次重試"
            sleep 5
          done
          exit 1
